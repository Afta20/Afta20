<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Afreeza Prananta (@Afta20) — Full-Stack Engineer &amp; UI/UX Designer</title>
  <desc id="svg-desc">Building AI-driven web platforms, zero-trust healthcare systems, and real-time maritime intelligence dashboards. Core pillars: AI-Driven Web Platforms, Zero-Trust Healthcare Systems, Real-Time Maritime Intelligence.</desc>
  <defs>
    <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace; }

    @keyframes beaconPulse {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.75); opacity: 0.08; }
    }
    @keyframes traceFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes pillarBreath {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }
    .beacon-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: beaconPulse 24s ease-in-out infinite;
      animation-delay: -6s;
    }
    .trace-flow {
      stroke-dasharray: 18 12;
      animation: traceFlow 24s linear infinite;
      animation-delay: -9s;
    }
    .pillar-0 { animation: pillarBreath 24s ease-in-out infinite; animation-delay: 0s; }
    .pillar-1 { animation: pillarBreath 24s ease-in-out infinite; animation-delay: -8s; }
    .pillar-2 { animation: pillarBreath 24s ease-in-out infinite; animation-delay: -16s; }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    </style>
    <pattern id="hero-grid-dark" width="18" height="18" patternUnits="userSpaceOnUse">
