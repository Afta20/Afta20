<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 198" width="405" height="198" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AftaStore (Afta20/AftaStore) — COMMERCE PLATFORM</title>
  <desc id="svg-desc">End-to-end storefront, inventory management, and role-safe checkout. Built with Next.js, TypeScript, Prisma, NextAuth.js.</desc>
  <defs>
    <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace; }

    @keyframes motifBreath {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.52; }
    }
    .motif-pulse {
      animation: motifBreath 24s ease-in-out infinite;
      animation-delay: -15s;
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    </style>
